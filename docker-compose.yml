services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reel_converter_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MAX_DOWNLOAD_SIZE_MB=100
      - DOWNLOAD_TIMEOUT_SECONDS=60
      - CONVERSION_TIMEOUT_SECONDS=120
      - CLEANUP_AFTER_MINUTES=30
      - DEFAULT_BITRATE=192k
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost
      - TEMP_DIR=/tmp/reel_converter
    volumes:
      - reel_converter_tmp:/tmp/reel_converter
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reel_converter_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  reel_converter_tmp:
    driver: local
